name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: linux, runner: ubuntu-22.04, asset: linux-x86_64}
          - {os: windows, runner: ubuntu-22.04, asset: windows-x86_64}
          - {os: macos, runner: macos-14, asset: macos-universal}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/deps
        with: {os: '${{ matrix.os }}'}
      - run: scripts/ci-build.sh ${{ matrix.os }} "${GITHUB_REF_NAME}"
      - name: Replays give the reference sync logs
        if: matrix.os != 'windows'
        run: scripts/ci-replay-check.sh build-ci-${{ matrix.os }}/spacehog
      - name: Replays give the reference sync logs (x86_64 slice, Rosetta)
        if: matrix.os == 'macos'
        run: scripts/ci-replay-check.sh build-ci-macos/spacehog arch -x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: spacehog-${{ matrix.asset }}
          path: dist/spacehog-${{ matrix.asset }}.*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Checksums
        run: cd dist && sha256sum spacehog-linux-x86_64.tar.gz spacehog-windows-x86_64.zip spacehog-macos-universal.tar.gz > SHA256SUMS
      # The release is created (with its notes, saying the regression set passed) by the
      # maintainer before the tag is pushed; this job only attaches the files. If there
      # is none yet, a draft is created.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "Operation Spacehog $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            spacehog-linux-x86_64.tar.gz spacehog-windows-x86_64.zip spacehog-macos-universal.tar.gz SHA256SUMS
