name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/deps
        with: {os: '${{ matrix.os }}'}
      - run: scripts/ci-build.sh ${{ matrix.os }} "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: spacehog-${{ matrix.os }}-x86_64
          path: dist/spacehog-${{ matrix.os }}-x86_64.*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Checksums
        run: cd dist && sha256sum spacehog-linux-x86_64.tar.gz spacehog-windows-x86_64.zip > SHA256SUMS
      # The release is created (with its notes, saying the regression set passed) by the
      # maintainer before the tag is pushed; this job only attaches the files. If there
      # is none yet, a draft is created.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "Operation Spacehog $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            spacehog-linux-x86_64.tar.gz spacehog-windows-x86_64.zip SHA256SUMS
